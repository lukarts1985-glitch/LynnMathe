<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lynns Mathe-Gymnastik 🤸‍♀️</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; }

    body {
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      display: flex; justify-content: center; align-items: flex-start;
      min-height: 100vh; padding: 1.5rem;
    }

    .app-container {
      display: flex; flex-direction: row; gap: 1.5rem;
      width: 100%; max-width: 920px; align-items: flex-start;
    }

    @media (max-width: 768px) {
      .app-container { flex-direction: column; align-items: center; }
    }

    .game-card, .stats-card {
      background: white; padding: 1.8rem; border-radius: 28px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.12); border: 4px solid #fff;
    }

    .game-card { flex: 1.2; width: 100%; text-align: center; }
    .stats-card { flex: 0.8; width: 100%; }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.2rem; background: #f3e8ff; padding: 0.8rem 1.2rem;
      border-radius: 18px;
    }

    .badge { font-size: 1.1rem; font-weight: 800; color: #7e22ce; display: flex; align-items: center; gap: 0.3rem; }

    .progress-bar-bg { width: 100px; height: 14px; background: #e9d5ff; border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: #38bdf8; transition: width 0.4s ease; border-radius: 10px; }

    .question-box { background: #f0fdf4; border: 3px dashed #34d399; border-radius: 20px; padding: 1.3rem 1rem; margin-bottom: 1.2rem; }
    .question-title { font-size: 0.95rem; color: #059669; text-transform: uppercase; font-weight: bold; }
    .question { font-size: 2.8rem; font-weight: 900; color: #1e293b; margin-top: 0.3rem; }

    .options-grid { display: flex; flex-direction: column; gap: 0.8rem; }
    .option-btn {
      width: 100%; padding: 0.9rem; border: none; border-radius: 16px;
      background: #a855f7; color: white; font-size: 1.5rem; font-weight: 800;
      cursor: pointer; box-shadow: 0 6px 0 #7e22ce; transition: all 0.1s ease;
    }
    .option-btn:hover:not(:disabled) { background: #9333ea; transform: translateY(-2px); }
    .option-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #7e22ce; }
    .option-btn:disabled { background: #cbd5e0; box-shadow: 0 6px 0 #a0aec0; cursor: not-allowed; opacity: 0.7; }

    .feedback { margin-top: 1rem; font-size: 1.1rem; font-weight: 800; min-height: 2.2rem; display: flex; align-items: center; justify-content: center; }

    .hint-box {
      background: #faf5ff; border: 2.5px solid #a855f7; color: #2d3748; padding: 1rem;
      border-radius: 18px; margin-top: 0.8rem; font-size: 1rem; font-weight: bold; text-align: left; display: none;
    }
    .step-item { background: white; padding: 0.5rem 0.8rem; border-radius: 10px; margin-top: 0.4rem; border-left: 4px solid #38bdf8; }

    .album-box { margin-top: 1.2rem; background: #fdf4ff; border-radius: 18px; padding: 0.8rem; border: 2px solid #f0abfc; }
    .album-title { font-size: 0.9rem; font-weight: bold; color: #86198f; margin-bottom: 0.6rem; }
    .sticker-grid { display: flex; justify-content: center; gap: 0.6rem; }
    .sticker { font-size: 1.8rem; background: white; padding: 0.4rem; border-radius: 12px; border: 2px solid #cbd5e0; filter: grayscale(100%); opacity: 0.4; transition: all 0.4s ease; }
    .sticker.unlocked { filter: grayscale(0%); opacity: 1; border-color: #a855f7; transform: scale(1.1); }

    .stats-title { font-size: 1.3rem; font-weight: 900; color: #581c87; margin-bottom: 1rem; }
    .week-table { width: 100%; border-collapse: collapse; margin-bottom: 1.2rem; }
    .week-table th, .week-table td { padding: 0.6rem 0.8rem; text-align: left; font-size: 0.95rem; }
    .week-table th { color: #6b21a8; border-bottom: 2px solid #f3e8ff; font-weight: 800; }
    .week-table tr { border-bottom: 1px solid #faf5ff; }
    .week-table tr.today { background: #f3e8ff; font-weight: bold; }
    .week-table tr.today td { color: #6b21a8; }
    .score-cell { text-align: right !important; font-weight: bold; }

    .summary-box { background: #faf5ff; padding: 1rem; border-radius: 16px; border: 2px solid #f3e8ff; display: flex; flex-direction: column; gap: 0.6rem; }
    .summary-row { display: flex; justify-content: space-between; font-size: 0.95rem; font-weight: bold; color: #581c87; }
    .summary-row.total { font-size: 1.1rem; color: #7e22ce; padding-top: 0.4rem; border-top: 2px dashed #e9d5ff; }

    .hunderter { color: #e11d48; font-weight: 900; }
    .zehner { color: #d97706; font-weight: 900; }
    .einer { color: #059669; font-weight: 900; }
    .highlight { color: #7e22ce; font-weight: 900; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="game-card">
    <div class="header">
      <div class="badge">⭐ <span id="score">0</span></div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress"></div></div>
      <div class="badge">🤸‍♀️ <span id="level">Lvl 1</span></div>
    </div>

    <div class="question-box">
      <div class="question-title">Berechne die Aufgabe für Lynn:</div>
      <div class="question" id="question">100 + 200</div>
    </div>

    <div class="options-grid" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="hint-box" id="hintBox"></div>

    <div class="album-box">
      <div class="album-title">🎀 Lynns Gymnastik-Sammlung</div>
      <div class="sticker-grid">
        <div class="sticker" id="st1" title="Level 1">⭕</div>
        <div class="sticker" id="st2" title="Level 2">🎗️</div>
        <div class="sticker" id="st3" title="Level 3">🪄</div>
        <div class="sticker" id="st4" title="Level 4">🏆</div>
        <div class="sticker" id="st5" title="Level 5">🥇</div>
      </div>
    </div>
  </div>

  <div class="stats-card">
    <div class="stats-title">📊 Lynns Wochen-Konto</div>
    <table class="week-table">
      <thead><tr><th>Tag</th><th style="text-align: right;">Zeit</th><th style="text-align: right;">Punkte</th></tr></thead>
      <tbody id="weekTableBody"></tbody>
    </table>

    <div class="summary-box">
      <div class="summary-row total"><span>🏆 Diese Woche:</span><span id="weeklyTotal">0 Pkt.</span></div>
      <div class="summary-row"><span>⏱️ Lernzeit Woche:</span><span id="weeklyTime">0 Min.</span></div>
      <div class="summary-row"><span>⭐ Vorwoche:</span><span id="prevWeekTotal">0 Pkt.</span></div>
      <div class="summary-row"><span>👑 Lynns Rekord:</span><span id="allTimeHigh">0 Pkt.</span></div>
    </div>
  </div>
</div>

<script>
  let totalScore = 0, currentCorrectAnswer = 0, level = 1, currentTaskData = {}, lockTimer = null;
  const daysNames = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
  let dailyScores = [0, 0, 0, 0, 0, 0, 0];
  let dailyTimes = [0, 0, 0, 0, 0, 0, 0]; // in Sekunden
  let prevWeekTotal = 0, allTimeHigh = 0;
  const compliments = ['Perfekte Kür! 🤸‍♀️', 'Wunderschön! ✨', 'Spitzenklasse! 🎀', 'Volle Punktzahl! 🏅', 'Super gemacht! 🌟'];

  // Timer für Aufgabenzeit (max 20 Sek pro Aufgabe)
  let taskTimer = null;
  let taskSeconds = 0;

  function startTaskTimer() {
    stopTaskTimer();
    taskSeconds = 0;
    taskTimer = setInterval(() => {
      if (taskSeconds < 20) {
        taskSeconds++;
        const todayIdx = getCurrentDayIndex();
        dailyTimes[todayIdx]++;
        saveProgress();
        updateUI();
      }
    }, 1000);
  }

  function stopTaskTimer() {
    if (taskTimer) {
      clearInterval(taskTimer);
      taskTimer = null;
    }
  }

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    if (m === 0) return `${s}s`;
    return `${m}m ${s}s`;
  }

  function getWeekId(d) {
    const target = new Date(d.valueOf()), dayNr = (d.getDay() + 6) % 7;
    target.setDate(target.getDate() - dayNr + 3);
    const firstThursday = target.valueOf();
    target.setMonth(0, 1);
    if (target.getDay() !== 4) target.setMonth(0, 1 + ((4 - target.getDay() + 7) % 7));
    return `${target.getFullYear()}-W${1 + Math.ceil((firstThursday - target) / 604800000)}`;
  }

  function getCurrentDayIndex() { return (new Date().getDay() + 6) % 7; }

  function loadProgress() {
    const currentWeekId = getWeekId(new Date());
    const savedWeekId = localStorage.getItem('lynn_week_id');
    const savedDaily = localStorage.getItem('lynn_daily_scores');
    const savedTimes = localStorage.getItem('lynn_daily_times');
    const savedPrev = localStorage.getItem('lynn_prev_week');
    const savedHigh = localStorage.getItem('lynn_highscore');

    if (savedPrev) prevWeekTotal = parseInt(savedPrev, 10);
    if (savedHigh) allTimeHigh = parseInt(savedHigh, 10);

    if (savedWeekId !== currentWeekId) {
      if (savedDaily) {
        const oldSum = JSON.parse(savedDaily).reduce((a, b) => a + b, 0);
        prevWeekTotal = oldSum;
        localStorage.setItem('lynn_prev_week', prevWeekTotal);
        if (oldSum > allTimeHigh) { allTimeHigh = oldSum; localStorage.setItem('lynn_highscore', allTimeHigh); }
      }
      dailyScores = [0, 0, 0, 0, 0, 0, 0];
      dailyTimes = [0, 0, 0, 0, 0, 0, 0];
      localStorage.setItem('lynn_week_id', currentWeekId);
      localStorage.setItem('lynn_daily_scores', JSON.stringify(dailyScores));
      localStorage.setItem('lynn_daily_times', JSON.stringify(dailyTimes));
    } else {
      if (savedDaily) dailyScores = JSON.parse(savedDaily);
      if (savedTimes) dailyTimes = JSON.parse(savedTimes);
    }
    updateUI();
  }

  function saveProgress() {
    localStorage.setItem('lynn_daily_scores', JSON.stringify(dailyScores));
    localStorage.setItem('lynn_daily_times', JSON.stringify(dailyTimes));
    const weekSum = dailyScores.reduce((a, b) => a + b, 0);
    if (weekSum > allTimeHigh) { allTimeHigh = weekSum; localStorage.setItem('lynn_highscore', allTimeHigh); }
  }

  function updateUI() {
    const weekSum = dailyScores.reduce((a, b) => a + b, 0);
    const totalTimeSec = dailyTimes.reduce((a, b) => a + b, 0);
    totalScore = weekSum;

    document.getElementById('score').innerText = totalScore;
    document.getElementById('weeklyTotal').innerText = `${weekSum} Pkt.`;
    document.getElementById('weeklyTime').innerText = formatTime(totalTimeSec);
    document.getElementById('prevWeekTotal').innerText = `${prevWeekTotal} Pkt.`;
    document.getElementById('allTimeHigh').innerText = `${allTimeHigh} Pkt.`;

    level = Math.floor(totalScore / 50) + 1;
    document.getElementById('level').innerText = `Lvl ${level}`;
    document.getElementById('progress').style.width = `${(totalScore % 50) * 2}%`;

    for (let i = 1; i <= 5; i++) {
      const el = document.getElementById(`st${i}`);
      if (level >= i) el.classList.add('unlocked'); else el.classList.remove('unlocked');
    }

    const todayIdx = getCurrentDayIndex(), tbody = document.getElementById('weekTableBody');
    tbody.innerHTML = '';
    daysNames.forEach((day, idx) => {
      const tr = document.createElement('tr');
      if (idx === todayIdx) tr.className = 'today';
      tr.innerHTML = `
        <td>${day} ${idx === todayIdx ? '📍' : ''}</td>
        <td style="text-align: right; color: #6b21a8;">${formatTime(dailyTimes[idx])}</td>
        <td class="score-cell">${dailyScores[idx]} Pkt.</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function generateTask() {
    document.getElementById('feedback').innerText = '';
    const hintBox = document.getElementById('hintBox'); hintBox.style.display = 'none'; hintBox.innerHTML = '';
    const type = Math.floor(Math.random() * 3);
    let num1, num2;
    if (type === 0) { num1 = (Math.floor(Math.random() * 8) + 1) * 100; num2 = (Math.floor(Math.random() * (10 - num1/100)) + 1) * 100; }
    else if (type === 1) { num1 = (Math.floor(Math.random() * 80) + 10) * 10; num2 = (Math.floor(Math.random() * (90 - num1/10)) + 1) * 10; }
    else { num1 = Math.floor(Math.random() * 500) + 50; num2 = Math.floor(Math.random() * (950 - num1)) + 10; }

    const isAddition = Math.random() > 0.4;
    if (isAddition) {
      currentCorrectAnswer = num1 + num2;
      document.getElementById('question').innerText = `${num1} + ${num2}`;
      currentTaskData = { n1: num1, n2: num2, op: '+' };
    } else {
      const max = Math.max(num1, num2), min = Math.min(num1, num2);
      currentCorrectAnswer = max - min;
      document.getElementById('question').innerText = `${max} - ${min}`;
      currentTaskData = { n1: max, n2: min, op: '-' };
    }

    let answers = new Set([currentCorrectAnswer]);
    while (answers.size < 3) {
      const offsets = [-100, -10, -1, 1, 10, 100];
      let wrong = currentCorrectAnswer + offsets[Math.floor(Math.random() * offsets.length)];
      if (wrong > 0 && wrong <= 1000 && wrong !== currentCorrectAnswer) answers.add(wrong);
    }

    const optionsDiv = document.getElementById('options'); optionsDiv.innerHTML = '';
    Array.from(answers).sort(() => Math.random() - 0.5).forEach(ans => {
      const btn = document.createElement('button');
      btn.className = 'option-btn'; btn.innerText = ans; btn.onclick = () => checkAnswer(ans);
      optionsDiv.appendChild(btn);
    });

    startTaskTimer();
  }

  function splitParts(num) { return { h: Math.floor(num / 100) * 100, z: Math.floor((num % 100) / 10) * 10, e: num % 10 }; }

  function getRechenwegErklaerung() {
    const { n1, n2, op } = currentTaskData, p2 = splitParts(n2);
    if (op === '+') {
      let step1 = n1 + p2.h, step2 = step1 + p2.z, finalAns = step2 + p2.e, stoppText = "";
      if (p2.z > 0 && (step1 % 100) + p2.z >= 100) {
        let bisH = 100 - (step1 % 100), restZ = p2.z - bisH, naechstH = step1 + bisH;
        stoppText = `<div class="step-item">💡 <b>Hunderter-Wechsel:</b> Auffüllen bis <span class="highlight">${naechstH}</span> (${step1}+${bisH}), dann Rest (+${restZ}) = <b>${step1 + p2.z}</b></div>`;
      }
      return `🧠 <b>Rechenweg:</b> Zerlege <span class="highlight">${n2}</span> in <span class="hunderter">${p2.h}H</span>, <span class="zehner">${p2.z}Z</span>, <span class="einer">${p2.e}E</span>:<br>
        <div class="step-item">1) ${n1} + ${p2.h} = <b>${step1}</b></div>
        ${stoppText ? stoppText : `<div class="step-item">2) ${step1} + ${p2.z} = <b>${step2}</b></div>`}
        ${p2.e > 0 ? `<div class="step-item">3) ${step2} + ${p2.e} = <b>${finalAns}</b></div>` : ''}`;
    } else {
      let step1 = n1 - p2.h, step2 = step1 - p2.z, finalAns = step2 - p2.e, stoppText = "";
      if (p2.z > 0 && (step1 % 100) < p2.z) {
        let bisH = step1 % 100, restZ = p2.z - bisH, naechstH = step1 - bisH;
        stoppText = `<div class="step-item">💡 <b>Hunderter-Rückschritt:</b> Zurück zu <span class="highlight">${naechstH}</span> (${step1}-${bisH}), dann Rest (-${restZ}) = <b>${step1 - p2.z}</b></div>`;
      }
      return `🧠 <b>Rechenweg:</b> Zerlege <span class="highlight">${n2}</span> in <span class="hunderter">${p2.h}H</span>, <span class="zehner">${p2.z}Z</span>, <span class="einer">${p2.e}E</span>:<br>
        <div class="step-item">1) ${n1} - ${p2.h} = <b>${step1}</b></div>
        ${stoppText ? stoppText : `<div class="step-item">2) ${step1} - ${p2.z} = <b>${step2}</b></div>`}
        ${p2.e > 0 ? `<div class="step-item">3) ${step2} - ${p2.e} = <b>${finalAns}</b></div>` : ''}`;
    }
  }

  function checkAnswer(selected) {
    stopTaskTimer();
    const feedbackDiv = document.getElementById('feedback'), hintBox = document.getElementById('hintBox');
    if (selected === currentCorrectAnswer) {
      dailyScores[getCurrentDayIndex()] += 10;
      saveProgress(); updateUI();
      feedbackDiv.innerText = `${compliments[Math.floor(Math.random() * compliments.length)]} +10 ⭐`;
      feedbackDiv.style.color = '#059669'; hintBox.style.display = 'none';
      setTimeout(generateTask, 1200);
    } else {
      hintBox.innerHTML = getRechenwegErklaerung(); hintBox.style.display = 'block';
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.disabled = true);
      let timeLeft = 10;
      feedbackDiv.innerText = `Lies den Rechenweg! ⏱️ (${timeLeft}s)`; feedbackDiv.style.color = '#e11d48';
      clearInterval(lockTimer);
      lockTimer = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) feedbackDiv.innerText = `Lies den Rechenweg! ⏱️ (${timeLeft}s)`;
        else { clearInterval(lockTimer); feedbackDiv.innerText = 'Gleich nochmal probieren! 💪'; buttons.forEach(btn => btn.disabled = false); }
      }, 1000);
    }
  }

  loadProgress(); generateTask();
</script>
</body>
</html>
